[build]
publish = "public"
command = "hugo --gc --minify"

[build.environment]
HUGO_VERSION = "0.165.0"
HUGO_ENV = "production"

[context.production]
command = "hugo --gc --minify --enableGitInfo -b https://pzb.netlify.app"

[context.production.environment]
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "hugo --gc --minify --enableGitInfo"

[context.split1.environment]
HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.next]
command = "hugo --gc --minify --enableGitInfo"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"

# Headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    # Google Fonts: Noto Serif SC
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; connect-src 'self';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache policy for generated static assets
[[headers]]
  for = "/(img|fonts|js|css)/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
