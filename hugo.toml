# Hugo configuration for Stack + Hugo 0.165
baseURL = "https://pzb.netlify.app"
title = "风轻云淡"
theme = "stack"
enableEmoji = true
enableGitInfo = true
enableRobotsTXT = true
hasCJKLanguage = true
copyright = "彭宅波"

[params]
  description = "记录技术与生活的点滴。"
  keywords = ["博客", "技术", "生活", "编程", "笔记"]
  favicon = "/images/favicon.ico"
  siteIcon = "/images/icon.png"
  mainSections = ["post"]
  featuredImageField = "image"
  rssFullContent = true
  [params.author]
    name = "彭宅波"
    email = "pzb678@criptext.com"
  [params.social]
    github = "pzb568"
    twitter = "penghub_cn"
  [params.footer]
    since = 2020
    customText = ""
  [params.sidebar]
    emoji = "🍥"
    subtitle = "把人生的每一天当做生命的最后一秒"
    [params.sidebar.avatar]
      enabled = true
      local = true
      src = "img/avatar.png"
  [params.opengraph]
    title = "风轻云淡 - 彭宅波的博客"
    description = "记录技术与生活的点滴。"
    type = "website"
    image = "https://cdn.jsdelivr.net/gh/pzb568/blog_filescdn@1.1/logo.gif"
  [params.search]
    enable = true
    indexOutput = "search-index.json"
    maxResults = 10
    minLength = 2
  [params.schema]
    type = "Person"
    name = "彭宅波"
    description = "记录技术与生活的点滴。"
    sameAs = ["https://github.com/pzb568", "https://twitter.com/penghub_cn"]
  [params.colorScheme]
    toggle = true
    default = "auto"
  [params.imageProcessing.cover]
    enabled = true
  [params.imageProcessing.content]
    enabled = true
  [params.article]
    math = false
    toc = true
    readingTime = true
    [params.article.license]
      enabled = true
      default = "Licensed under CC BY-NC-SA 4.0"
  [params.comments]
    enabled = false
    provider = "disqus"
  [[params.widgets.homepage]]
    type = "search"
  [[params.widgets.homepage]]
    type = "archives"
    [params.widgets.homepage.params]
      limit = 5
  [[params.widgets.homepage]]
    type = "categories"
    [params.widgets.homepage.params]
      limit = 10
  [[params.widgets.homepage]]
    type = "tag-cloud"
    [params.widgets.homepage.params]
      limit = 10
  [[params.widgets.page]]
    type = "toc"

[services.disqus]
  shortname = ""

[pagination]
  pagerSize = 3

[permalinks]
  post = "/:year/:month/:slug/"
  page = "/:slug/"

[markup.goldmark.renderer]
  unsafe = true
  hardWraps = true
  xHTML = false
[markup.goldmark.extensions]
  typographer = true
  footnote = true
  definitionList = true
[markup.goldmark.extensions.passthrough]
  enable = true
[markup.goldmark.extensions.passthrough.delimiters]
  block = [["\\[", "\\]"], ["$$", "$$"]]
  inline = [["\\(", "\\)"]]
[markup.highlight]
  codeFences = true
  guessSyntax = true
  lineNos = true
  lineNumbersInTable = true
  style = "monokai"
  noClasses = false
[markup.tableOfContents]
  endLevel = 4
  ordered = true
  startLevel = 2

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[menu]
  [[menu.main]]
    identifier = "Home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "Archives"
    name = "归档"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    identifier = "Search"
    name = "搜索"
    url = "/search/"
    weight = 3
  [[menu.main]]
    identifier = "About"
    name = "关于"
    url = "/about/"
    weight = 4
  [[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/pzb568"
    [menu.social.params]
      icon = "brand-github"
  [[menu.social]]
    identifier = "twitter"
    name = "Twitter"
    url = "https://twitter.com/penghub_cn"
    [menu.social.params]
      icon = "brand-twitter"

[related]
  includeNewer = true
  threshold = 60
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 200

[minify]
  minifyOutput = true
  [minify.tdewolff.html]
    keepSpecialComments = true
    keepDefaultAttrVals = false
    keepWhitespace = false
  [minify.tdewolff.css]
    precision = 5
  [minify.tdewolff.js]
    keepVarNames = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[module.hugoVersion]
  extended = true
  min = "0.165.0"
